name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  # Must match <TargetFramework> in the csproj files.
  DOTNET_VERSION: "8.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # The data and simulation layers never reference GodotSharp, so their tests
  # need no engine at all. Keeping them in a separate job means the fast signal
  # is not gated behind a 100 MB editor download.
  sim:
    name: Simulation + data (engine-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The parity suites assert against real upstream content, and external/ is
      # gitignored, so this job has to fetch it. Without it 80 tests Ignore
      # themselves and the run proves far less than its green tick suggests --
      # which is exactly what happened for three pushes before this step existed.
      # Data only: nothing here compiles or reads the C++.
      - name: Fetch upstream dataset
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/endless-sky/endless-sky.git external/endless-sky
          git -C external/endless-sky sparse-checkout set data

      # A green run that quietly skipped the parity suites is the failure mode
      # this job exists to rule out, so check the dataset landed before testing
      # rather than reading it out of the skip count afterwards.
      - name: Fail fast if the dataset is missing
        run: |
          set -euo pipefail
          test -f external/endless-sky/data/commodities.txt \
            || { echo "::error::upstream dataset absent; the parity suites would silently skip"; exit 1; }

      - name: Test
        run: dotnet test tests/sim/EndlessSky.SimTests.csproj --nologo -v minimal

  godot:
    name: Engine build + headless smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache Godot .NET binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-mono-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot .NET
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${base}.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mkdir -p ~/godot
          mv "/tmp/${base}"/* ~/godot/
          chmod +x ~/godot/"Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          ln -sf ~/godot/"Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" ~/godot/godot

      - name: Expose GODOT_BIN
        run: |
          echo "GODOT_BIN=$HOME/godot/godot" >> "$GITHUB_ENV"
          "$HOME/godot/godot" --version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # No upstream fetch here on purpose: the game loads universe/ (The Reach),
      # which is committed, so this job needs nothing from external/. The parity
      # suites that DO need it live in the sim job, which fetches it there.

      - name: Import assets
        run: $GODOT_BIN --headless --path . --import

      - name: Build
        run: dotnet build EndlessSky.sln --nologo -v minimal

      # Boots the real main scene against the real dataset: catches broken
      # scenes, missing data and C# load failures that compilation alone misses.
      - name: Headless smoke run
        run: |
          set -euo pipefail
          output=$($GODOT_BIN --headless --path . --quit-after 60 2>&1)
          echo "$output"
          echo "$output" | grep -q '^\[flight\]' \
            || { echo "::error::flight scene did not report startup state"; exit 1; }

      # Plays a bounty end to end -- accept, fly, fight, report. This is the only
      # check that exercises libs/ and src/game/ together, and it is where the
      # defect class that unit tests cannot see has actually been caught before.
      - name: Mission and combat smoke run
        run: |
          set -euo pipefail
          output=$($GODOT_BIN --headless --path . --quit-after 20000 -- --mission-smoke 2>&1)
          echo "$output"
          echo "$output" | grep -q '^\[smoke\] PASS' \
            || { echo "::error::mission smoke did not reach its objective"; exit 1; }

      # The presentation suites need a real engine, so they cannot run in the sim
      # job. Non-gating for now: this is the first time they have run on Linux CI
      # at all, and gdUnit4's connect handshake is documented as timing-sensitive
      # (see CLAUDE.md). Promote to a gate once it has proven stable across runs.
      - name: In-engine test suite (gdUnit4)
        continue-on-error: true
        run: pwsh tools/test.ps1 -Suite godot

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            reports/
            *.log
          if-no-files-found: ignore
          retention-days: 14
