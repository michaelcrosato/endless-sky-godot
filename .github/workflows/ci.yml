name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  # Must match <TargetFramework> in the csproj files.
  DOTNET_VERSION: "8.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # The data and simulation layers never reference GodotSharp, so their tests
  # need no engine at all. Keeping them in a separate job means the fast signal
  # is not gated behind a 100 MB editor download.
  sim:
    name: Simulation + data (engine-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Required parity fixtures fail when absent. Fetch the same pinned revision
      # through the same command used for local tests.
      - name: Fetch upstream dataset
        run: pwsh tools/get-data.ps1

      - name: Test
        run: pwsh tools/test.ps1 -Suite sim

      - name: Packaging script regressions
        run: pwsh tests/tools/PackageTests.ps1

      # universe/ is a build artifact with a source, and that claim is only worth
      # anything if it is checked. It was not: emit.py picked each job's NPC hull with
      # Python's salted hash(), so every regeneration produced a different jobs.txt and
      # the committed one could not be reproduced by anyone. Regenerating here and
      # diffing keeps the generator and its output honest with each other.
      - name: The generated universe still regenerates
        run: |
          set -euo pipefail
          python3 tools/worldgen/worldgen.py --out /tmp/universe-check
          diff -r universe /tmp/universe-check \
            || { echo "::error::universe/ does not match tools/worldgen output; regenerate and commit"; exit 1; }

  godot:
    name: Engine build + headless smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache Godot .NET binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-mono-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot .NET
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${base}.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mkdir -p ~/godot
          mv "/tmp/${base}"/* ~/godot/
          chmod +x ~/godot/"Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          ln -sf ~/godot/"Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" ~/godot/godot

      - name: Expose GODOT_BIN
        run: |
          echo "GODOT_BIN=$HOME/godot/godot" >> "$GITHUB_ENV"
          "$HOME/godot/godot" --version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # No upstream fetch here on purpose: the game loads universe/ (The Reach),
      # which is committed, so this job needs nothing from external/. The parity
      # suites that DO need it live in the sim job, which fetches it there.

      - name: Import assets
        run: $GODOT_BIN --headless --path . --import

      - name: Build
        run: dotnet build EndlessSky.sln --nologo -v minimal

      # Requires explicit completion, no engine errors and a successful exit.
      # Save smoke uses a temporary slot. Tutorial proves delivery and payment;
      # mission currently proves combat resolution, including possible player loss.
      - name: Runtime smoke scenarios
        run: pwsh tools/smoke.ps1 -NoBuild

      # The presentation suites need a real engine, so they cannot run in the sim
      # job. This was non-gating on its first run and it earned that caution: it
      # failed, and only looked green because of it. The cause was not flakiness —
      # gdUnit4's command-line runner lives in addons/gdUnit4/bin/, which the
      # blanket `bin/` in .gitignore swallowed, so no clone had ever had it. With
      # the runner committed the step passes, and it gates.
      - name: In-engine test suite (gdUnit4)
        run: pwsh tools/test.ps1 -Suite godot

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            reports/
            *.log
          if-no-files-found: ignore
          retention-days: 14
