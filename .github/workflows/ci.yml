name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  # Must match <TargetFramework> in the csproj files.
  DOTNET_VERSION: "8.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # The data and simulation layers never reference GodotSharp, so their tests
  # need no engine at all. Keeping them in a separate job means the fast signal
  # is not gated behind a 100 MB editor download.
  sim:
    name: Simulation + data (engine-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: dotnet test tests/sim/EndlessSky.SimTests.csproj --nologo -v minimal

  godot:
    name: Engine build + headless smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache Godot .NET binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-mono-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot .NET
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -fsSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${base}.zip"
          unzip -q /tmp/godot.zip -d /tmp
          mkdir -p ~/godot
          mv "/tmp/${base}"/* ~/godot/
          chmod +x ~/godot/"Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          ln -sf ~/godot/"Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" ~/godot/godot

      - name: Expose GODOT_BIN
        run: |
          echo "GODOT_BIN=$HOME/godot/godot" >> "$GITHUB_ENV"
          "$HOME/godot/godot" --version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # external/ is gitignored, so the upstream content the game loads at
      # startup has to be fetched here the same way a developer would.
      - name: Fetch upstream reference (source + data)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/endless-sky/endless-sky.git external/endless-sky
          git -C external/endless-sky sparse-checkout set source data

      - name: Import assets
        run: $GODOT_BIN --headless --path . --import

      - name: Build
        run: dotnet build EndlessSky.sln --nologo -v minimal

      # Boots the real main scene against real upstream content: catches broken
      # scenes, missing data and C# load failures that compilation alone misses.
      - name: Headless smoke run
        run: |
          set -euo pipefail
          output=$($GODOT_BIN --headless --path . --quit-after 60 2>&1)
          echo "$output"
          echo "$output" | grep -q '^\[flight\]' \
            || { echo "::error::flight scene did not report startup state"; exit 1; }

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            reports/
            *.log
          if-no-files-found: ignore
          retention-days: 14
